name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  unit-tests:
    name: Unit Tests 🧪
    uses: ./.github/workflows/tests.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: [build-project, unit-tests]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - uses: actions/checkout@v7
        if: fromJSON(steps.check.outputs.validTag)
        with:
          path: source

      - name: Check Tag Matches buildspec.json 🔢
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Check Tag Matches buildspec.json 🔢
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # The tag must equal buildspec.json's version exactly: tag 1.2.3 needs
          # "version": "1.2.3", tag 1.2.3-beta1 needs "version": "1.2.3-beta1"
          # (the plugin reports and the packages are named with that version)
          spec_version="$(jq -r '.version' source/buildspec.json)"
          if [[ "${GITHUB_REF_NAME}" != "${spec_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match buildspec.json version ${spec_version}"
            exit 1
          fi

      - name: Package Lua Helper and Examples 🌙
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Package Lua Helper and Examples 🌙
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # Script authors who only need the helper: lua/ as obs-lua-bridge-lua-<version>/,
          # without StopWatch (attached on its own in the next step)
          name="obs-lua-bridge-lua-${GITHUB_REF_NAME}"
          cp -R source/lua "${name}"
          rm -rf "${name}/stopwatch"
          zip -r -q "${name}.zip" "${name}"
          rm -rf "${name}"

      - name: Package StopWatch ⏱️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Package StopWatch ⏱️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s nullglob

          # StopWatch is not installed with the plugin: its script, its guide and its release
          # note are separate downloads. GitHub rewrites brackets and spaces in asset names, so
          # "StopWatch-[6.2].lua" is attached as StopWatch-6.2.lua.
          scripts=(source/lua/stopwatch/StopWatch-\[*\].lua)
          if (( ${#scripts[@]} != 1 )); then
            echo "::error::Expected exactly one StopWatch-[<version>].lua in lua/stopwatch/, found ${#scripts[@]}"
            exit 1
          fi
          sw_version="${scripts[0]##*/StopWatch-[}"
          sw_version="${sw_version%].lua}"
          note="source/lua/stopwatch/Release Note [${sw_version}].md"
          guide="source/lua/stopwatch/STOPWATCH-LUABRIDGE.md"
          for file in "${note}" "${guide}"; do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Missing ${file}"
              exit 1
            fi
          done
          cp "${scripts[0]}" "StopWatch-${sw_version}.lua"
          cp "${guide}" "STOPWATCH-LUABRIDGE.md"
          cp "${note}" "StopWatch-${sw_version}-Release-Note.md"
          rm -rf source

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v8
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          # (The Lua zip from the step above is already in the root directory)
          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip|*.lua|*.md); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
            ${{ github.workspace }}/*.lua
            ${{ github.workspace }}/*.md
